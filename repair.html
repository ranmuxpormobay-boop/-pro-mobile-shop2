<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>งานแจ้งซ่อม</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="sidebar">
  <h2>เมนูหลัก</h2>
  <ul>
    <li><a href="index.html">หน้าแรก</a></li>
    <li><a href="add-product.html">เพิ่มสินค้า</a></li>
    <li><a href="repair.html">แจ้งซ่อม</a></li>
    <li><a href="member.html">ลูกค้าผ่อน</a></li>
    <li><a href="sales.html">รายงานยอดขาย</a></li>
  </ul>
</div>
<div class="content">
  <h1>งานแจ้งซ่อม</h1>
  <form id="repair-form">
    <input type="text" id="r-name" placeholder="ชื่อ-นามสกุลลูกค้า" required />
    <input type="text" id="r-model" placeholder="รุ่นมือถือ" required />
    <div class="form-row">
      <button type="button" id="repair-search-btn" class="btn btn-blue">ค้นหา</button>
      <input type="text" id="r-estimate" placeholder="ประเมินราคาซ่อม" readonly />
    </div>
    <button type="submit" class="btn btn-green">บันทึกข้อมูลในGoogle Sheet</button>
  </form>
  <div id="repair-list" class="table-container"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="script.js"></script>
</body>
</html>
